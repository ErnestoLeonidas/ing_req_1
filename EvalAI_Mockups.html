<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EvalAI · Mockups</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
if (window.tailwind) tailwind.config = { theme: { extend: { colors: {
  navy: { DEFAULT: '#1F3864', 50: '#EAF0F8', 100: '#D9E2F3', 700: '#1F3864', 900: '#14254A' },
  gold: { DEFAULT: '#C99A2E', 50: '#FBF1DC' }
}, fontFamily: { sans: ['Inter', 'system-ui', 'Segoe UI', 'Arial', 'sans-serif'] } } } };
</script>
<style>
  body { background: #E5E8EE; }
  .phone { width: 390px; height: 780px; border-radius: 44px; border: 12px solid #111827; overflow: hidden; position: relative; background: #fff; }
  .phone::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 130px; height: 24px; background: #111827; border-radius: 0 0 16px 16px; z-index: 20; }
  .sheet-shadow { box-shadow: 0 10px 30px rgba(15,23,42,.18); }
  .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
  .grow { animation: grow 3s ease-out forwards; } @keyframes grow { from { width: 5%; } to { width: 92%; } }
  .capturing .no-cap { display: none !important; }
</style>
</head>
<body class="font-sans text-slate-800 antialiased">

<!-- Barra de control (no forma parte del mockup) -->
<div id="toolbar" class="fixed top-0 inset-x-0 z-50 bg-slate-900 text-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center gap-2">
    <span class="font-semibold text-gold mr-1">EvalAI · Mockups</span>
    <button id="prev" class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600" title="Anterior (←)">←</button>
    <select id="screenSel" class="bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm max-w-[22rem]"></select>
    <button id="next" class="px-2 py-1 rounded bg-slate-700 hover:bg-slate-600" title="Siguiente (→)">→</button>
    <div id="states" class="flex flex-wrap gap-1 ml-2"></div>
    <div class="ml-auto flex gap-2">
      <button id="dl" class="px-3 py-1 rounded bg-gold text-slate-900 font-semibold hover:brightness-110 text-sm">Descargar PNG</button>
      <button id="hide" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-sm" title="Tecla H">Ocultar barra</button>
    </div>
  </div>
  <div id="hint" class="max-w-7xl mx-auto px-4 pb-2 text-xs text-slate-300"></div>
</div>
<button id="showBar" class="hidden fixed top-2 right-2 z-50 px-2 py-1 text-xs rounded bg-slate-900/70 text-white">Mostrar barra (H)</button>

<main id="stage" class="pt-28 pb-10 px-4 min-h-screen overflow-x-auto"></main>
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow-lg"></div>

<script>
// ===================== Datos de ejemplo =====================
const CURR = {
  'Matemática': {
    '5° básico': [
      { oa: 'OA 7 · Fracciones propias', ind: ['Representan fracciones propias de manera concreta y pictórica.', 'Comparan fracciones con igual denominador.'] },
      { oa: 'OA 11 · Números decimales', ind: ['Leen y escriben decimales hasta la milésima.', 'Ordenan números decimales en la recta numérica.'] }
    ],
    '6° básico': [
      { oa: 'OA 4 · Fracciones y números mixtos', ind: ['Convierten números mixtos en fracciones impropias.', 'Resuelven adiciones de fracciones con distinto denominador.'] },
      { oa: 'OA 7 · Razones', ind: ['Explican el concepto de razón con ejemplos de la vida diaria.', 'Identifican razones equivalentes.', 'Resuelven problemas que involucran razones.'] },
      { oa: 'OA 9 · Porcentajes', ind: ['Calculan el porcentaje de una cantidad.', 'Relacionan porcentajes con fracciones y decimales.'] }
    ]
  },
  'Lenguaje y Comunicación': {
    '5° básico': [{ oa: 'OA 3 · Lectura de textos variados', ind: ['Extraen información explícita de un texto.', 'Infieren el propósito del autor.'] }],
    '6° básico': [
      { oa: 'OA 4 · Textos literarios', ind: ['Describen a los personajes a partir de sus acciones.', 'Interpretan el lenguaje figurado.'] },
      { oa: 'OA 6 · Textos no literarios', ind: ['Identifican la idea principal de un texto informativo.', 'Relacionan la información del texto con imágenes y tablas.'] }
    ]
  }
};
const IND = ['I1 · Explican el concepto de razón', 'I2 · Identifican razones equivalentes', 'I3 · Resuelven problemas con razones'];
const Q0 = [
  { t: 'En un curso hay 12 niñas y 18 niños. ¿Cuál es la razón entre niñas y niños?', a: ['12 : 30', '2 : 3', '3 : 2', '18 : 12'], c: 1, i: 0 },
  { t: 'La razón entre lápices rojos y azules es 3 : 5. Si hay 15 lápices azules, ¿cuántos rojos hay?', a: ['5', '8', '9', '25'], c: 2, i: 2 },
  { t: '¿Cuál de estas razones es equivalente a 4 : 6?', a: ['2 : 3', '3 : 4', '6 : 4', '4 : 10'], c: 0, i: 1 },
  { t: 'Una receta usa 2 tazas de harina por cada taza de leche. ¿Qué razón hay entre harina y leche?', a: ['1 : 2', '2 : 1', '2 : 3', '3 : 1'], c: 1, i: 0 },
  { t: 'Un plano tiene escala 1 : 100. Si una pieza mide 4 cm en el plano, ¿cuánto mide en la realidad?', a: ['40 cm', '104 cm', '400 cm', '4.000 cm'], c: 2, i: 2 },
  { t: 'En una bolsa hay 5 bolitas verdes y 10 amarillas. ¿Qué razón equivalente representa verdes a amarillas?', a: ['1 : 2', '1 : 3', '2 : 1', '5 : 15'], c: 0, i: 1 },
  { t: 'En un refugio la razón entre perros y gatos es 4 : 1. Si hay 20 animales, ¿cuántos gatos hay?', a: ['4', '5', '16', '1'], c: 0, i: 2 },
  { t: '¿Qué significa que la razón entre cuadrados y círculos sea 3 : 4?', a: ['Por cada 3 cuadrados hay 4 círculos.', 'Por cada 3 círculos hay 4 cuadrados.', 'Siempre hay 7 figuras en total.', 'Hay más cuadrados que círculos.'], c: 0, i: 0 },
  { t: 'Juan lee 2 páginas en 5 minutos. A ese ritmo, ¿cuántas páginas lee en 20 minutos?', a: ['4', '8', '10', '40'], c: 1, i: 2 },
  { t: 'En un curso de 30 estudiantes, la razón entre quienes traen colación y quienes no es 2 : 1. ¿Cuántos traen colación?', a: ['10', '15', '20', '25'], c: 2, i: 2 }
];
const STUDENTS = ['Martina González', 'Benjamín Rojas', 'Sofía Muñoz', 'Agustín Díaz', 'Isidora Pérez', 'Tomás Soto', 'Florencia Silva', 'Vicente Contreras'];
const REPORT = [
  ['OA 4 · I1', 'Convierten números mixtos en fracciones impropias', [86, 81, 74]],
  ['OA 4 · I2', 'Resuelven adiciones de fracciones con distinto denominador', [62, 55, 47]],
  ['OA 7 · I1', 'Explican el concepto de razón', [91, 84, 88]],
  ['OA 7 · I2', 'Identifican razones equivalentes', [44, 52, 38]],
  ['OA 7 · I3', 'Resuelven problemas que involucran razones', [71, 66, 58]],
  ['OA 9 · I1', 'Calculan el porcentaje de una cantidad', [79, 83, 69]]
];

// ===================== Estado =====================
const S = {
  asig: '', nivel: '', oa: '', ind: [],
  qs: JSON.parse(JSON.stringify(Q0)), editIdx: 1,
  pubError: false, published: false,
  student: 0, cam: 'encuadre', semaforo: false,
  ans: [1, 2, null, 1, 2, null, 0, 0, 1, 2], cur: 2, sent: false, animate: true
};

// ===================== Utilidades UI =====================
const $ = (s) => document.querySelector(s);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('hidden'), 2600); }
const L = 'ABCD';
function logo(light) {
  return `<div class="flex items-center gap-2"><div class="w-8 h-8 rounded-lg ${light ? 'bg-white/15' : 'bg-navy'} grid place-items-center text-white font-bold">E</div><span class="font-bold text-lg ${light ? 'text-white' : 'text-navy'}">Eval<span class="text-gold">AI</span></span></div>`;
}
function desktop(role, user, body, active) {
  const nav = role === 'utp' ? ['Reportes'] : ['Mis evaluaciones', 'Corregir', 'Reportes'];
  return `<div id="capture" class="w-[1200px] min-h-[720px] bg-slate-50 rounded-xl overflow-hidden sheet-shadow flex">
    <aside class="w-56 bg-navy text-white p-5 flex flex-col gap-6">
      ${logo(true)}
      <nav class="flex flex-col gap-1 text-sm">${nav.map(n => `<a class="px-3 py-2 rounded-lg ${n === active ? 'bg-white/15 font-semibold' : 'text-white/70'}">${n}</a>`).join('')}</nav>
      <div class="mt-auto text-xs text-white/60">Colegio Alerce Andino</div>
    </aside>
    <div class="flex-1 flex flex-col">
      <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between">
        <div class="text-sm text-slate-500">${role === 'utp' ? 'Coordinación académica (UTP)' : 'Docente'}</div>
        <div class="flex items-center gap-3"><span class="text-sm font-medium">${user}</span><div class="w-9 h-9 rounded-full bg-gold/20 text-gold grid place-items-center font-bold">${user.split(' ').map(x => x[0]).join('')}</div></div>
      </header>
      <section class="flex-1 p-8">${body}</section>
    </div>
  </div>`;
}
function phone(body, dark) {
  return `<div id="capture" class="phone sheet-shadow ${dark ? 'bg-slate-900' : ''}"><div class="h-full flex flex-col ${dark ? 'text-white' : ''}">
    <div class="h-10 px-6 pt-3 flex justify-between text-xs ${dark ? 'text-white/80' : 'text-slate-500'}"><span>19:42</span><span>●●● 5G ▮</span></div>
    ${body}</div></div>`;
}
function student(body) {
  return `<div id="capture" class="w-[1000px] min-h-[680px] bg-slate-50 rounded-xl overflow-hidden sheet-shadow flex flex-col">
    <header class="h-16 bg-navy px-8 flex items-center justify-between">${logo(true)}<span class="text-white/80 text-sm">Martina González · 6° A</span></header>
    <section class="flex-1 p-10">${body}</section></div>`;
}
function btn(label, cls = '', attrs = '') { return `<button ${attrs} class="px-4 py-2 rounded-lg text-sm font-semibold ${cls}">${label}</button>`; }
const P1 = 'bg-navy text-white hover:bg-navy-900', P2 = 'bg-white border border-slate-300 text-slate-700 hover:bg-slate-100';

function qr(seed, size = 84) {
  let h = 0; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const n = 21, cell = size / n; let r = '';
  const finder = (x, y) => (x < 7 && y < 7) || (x >= n - 7 && y < 7) || (x < 7 && y >= n - 7);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (finder(x, y)) { const fx = x >= n - 7 ? x - (n - 7) : x, fy = y >= n - 7 ? y - (n - 7) : y; on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx >= 2 && fx <= 4 && fy >= 2 && fy <= 4); }
    else { h = (h * 1103515245 + 12345) >>> 0; on = (h >> 16) % 2 === 0; }
    if (on) r += `<rect x="${x * cell}" y="${y * cell}" width="${cell + .2}" height="${cell + .2}"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#111">${r}</svg>`;
}
function semColor(v) { return v < 50 ? 'bg-red-100 text-red-800' : v < 80 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'; }
function dot(v) { return v < 50 ? 'bg-red-500' : v < 80 ? 'bg-amber-400' : 'bg-emerald-500'; }

// ===================== Pantallas =====================
const SCREENS = [
  { id: 'P-01', name: 'Panel del docente', hu: 'HU-1.1', hint: 'Pulsa «Nueva evaluación» para ir a P-02.', render() {
    const rows = [['Fracciones y números mixtos', '6° A', 'Corregida', '28 de 32 hojas'], ['Porcentajes', '6° B', 'Publicada', 'En línea · 12 de 31 respuestas'], ['Comprensión de textos literarios', '6° A', 'Borrador', '—']];
    const badge = { Corregida: 'bg-emerald-100 text-emerald-800', Publicada: 'bg-navy-50 text-navy', Borrador: 'bg-slate-200 text-slate-700' };
    return desktop('doc', 'Carla Rojas', `
      <div class="flex items-end justify-between mb-6"><div><h1 class="text-2xl font-bold text-navy">Hola, Carla</h1><p class="text-slate-500">Tienes 3 evaluaciones este mes.</p></div>
      ${btn('+ Nueva evaluación', P1 + ' px-5 py-3 text-base', 'data-go="P-02"')}</div>
      <div class="grid grid-cols-3 gap-4 mb-8">${[['Evaluaciones creadas', '12'], ['Hojas corregidas', '214'], ['Horas ahorradas (estimado)', '9,5']].map(([a, b]) => `<div class="bg-white rounded-xl p-5 border border-slate-200"><div class="text-sm text-slate-500">${a}</div><div class="text-3xl font-bold text-navy mt-1">${b}</div></div>`).join('')}</div>
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden"><div class="px-6 py-4 font-semibold border-b">Mis evaluaciones</div>
      <table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr><th class="text-left px-6 py-3">Evaluación</th><th class="text-left">Curso</th><th class="text-left">Estado</th><th class="text-left">Avance</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr class="border-t"><td class="px-6 py-4 font-medium">${r[0]}</td><td>${r[1]}</td><td><span class="px-2 py-1 rounded-full text-xs font-semibold ${badge[r[2]]}">${r[2]}</span></td><td class="text-slate-500">${r[3]}</td><td class="pr-6 text-right"><a class="text-navy font-semibold">Abrir</a></td></tr>`).join('')}</tbody></table></div>`, 'Mis evaluaciones');
  } },

  { id: 'P-02', name: 'Nueva evaluación', hu: 'HU-1.1', hint: 'Elige asignatura y nivel: el selector de OA muestra solo los de esa combinación (CA-1.1-1). «Generar» se activa con al menos un indicador (CA-1.1-2).',
    states: [['Vacía', () => { S.asig = S.nivel = S.oa = ''; S.ind = []; }], ['Completa', () => { S.asig = 'Matemática'; S.nivel = '6° básico'; S.oa = 'OA 7 · Razones'; S.ind = [0, 1, 2]; }]],
    render() {
    const niveles = S.asig ? Object.keys(CURR[S.asig]) : [];
    const oas = S.asig && S.nivel ? CURR[S.asig][S.nivel] : [];
    const oaObj = oas.find(o => o.oa === S.oa);
    const ok = S.ind.length > 0;
    const sel = (id, label, opts, val, dis) => `<label class="block"><span class="text-sm font-medium text-slate-600">${label}</span>
      <select id="${id}" ${dis ? 'disabled' : ''} class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 ${dis ? 'bg-slate-100 text-slate-400' : ''}">
      <option value="">Selecciona…</option>${opts.map(o => `<option ${o === val ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`;
    return desktop('doc', 'Carla Rojas', `
      <div class="text-sm text-slate-500 mb-1">Mis evaluaciones › Nueva evaluación</div>
      <h1 class="text-2xl font-bold text-navy mb-6">Nueva evaluación</h1>
      <div class="flex gap-6">
        <div class="flex-1 bg-white rounded-xl border border-slate-200 p-6 space-y-5">
          <div class="grid grid-cols-2 gap-4">${sel('sAsig', '1. Asignatura', Object.keys(CURR), S.asig)}${sel('sNivel', '2. Nivel', niveles, S.nivel, !S.asig)}</div>
          ${sel('sOa', '3. Objetivo de aprendizaje (OA)', oas.map(o => o.oa), S.oa, !S.nivel)}
          <div><span class="text-sm font-medium text-slate-600">4. Indicadores de logro</span>
          <div class="mt-2 space-y-2">${oaObj ? oaObj.ind.map((t, i) => `<label class="flex items-start gap-3 p-3 rounded-lg border ${S.ind.includes(i) ? 'border-navy bg-navy-50' : 'border-slate-200'} cursor-pointer"><input type="checkbox" data-ind="${i}" ${S.ind.includes(i) ? 'checked' : ''} class="mt-1 accent-[#1F3864]"><span class="text-sm">${t}</span></label>`).join('') : '<div class="text-sm text-slate-400 p-3 border border-dashed rounded-lg">Elige un OA para ver sus indicadores.</div>'}</div></div>
        </div>
        <div class="w-80 bg-white rounded-xl border border-slate-200 p-6 h-fit">
          <div class="font-semibold mb-3">Resumen</div>
          <dl class="text-sm space-y-2"><div class="flex justify-between"><dt class="text-slate-500">Preguntas</dt><dd>10 (por defecto)</dd></div><div class="flex justify-between"><dt class="text-slate-500">Dificultad</dt><dd>Intermedia</dd></div><div class="flex justify-between"><dt class="text-slate-500">Indicadores</dt><dd>${S.ind.length}</dd></div></dl>
          ${btn('Generar preguntas', (ok ? P1 : 'bg-slate-200 text-slate-400 cursor-not-allowed') + ' w-full mt-6 py-3', ok ? 'data-go="P-03"' : 'disabled')}
          ${ok ? '' : '<p class="text-xs text-amber-700 bg-amber-50 rounded-lg p-2 mt-3">Selecciona al menos un indicador de logro para generar preguntas.</p>'}
        </div>
      </div>`, 'Mis evaluaciones');
  },
    bind() {
      const on = (id, f) => { const e = $('#' + id); if (e) e.onchange = (ev) => { f(ev.target.value); draw(); }; };
      on('sAsig', v => { S.asig = v; S.nivel = S.oa = ''; S.ind = []; });
      on('sNivel', v => { S.nivel = v; S.oa = ''; S.ind = []; });
      on('sOa', v => { S.oa = v; S.ind = []; });
      document.querySelectorAll('[data-ind]').forEach(c => c.onchange = () => { const i = +c.dataset.ind; S.ind = c.checked ? [...S.ind, i] : S.ind.filter(x => x !== i); draw(); });
    } },

  { id: 'P-03', name: 'Generando preguntas', hu: 'HU-1.2.1', hint: 'Simula la espera mientras la IA genera. Usa «Congelar» para capturar la barra quieta.',
    states: [['Animar', () => S.animate = true], ['Congelar', () => S.animate = false]],
    render() {
    return desktop('doc', 'Carla Rojas', `<div class="h-full grid place-items-center"><div class="bg-white rounded-2xl border border-slate-200 p-12 w-[560px] text-center">
      <div class="w-16 h-16 mx-auto rounded-full border-4 border-navy-100 border-t-navy ${S.animate ? 'spin' : ''}"></div>
      <h2 class="text-xl font-bold text-navy mt-6">Generando preguntas con IA…</h2>
      <p class="text-slate-500 mt-2">OA 7 · Razones · 3 indicadores de logro</p>
      <div class="mt-6 h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-gold ${S.animate ? 'grow' : ''}" style="width:${S.animate ? '5' : '64'}%"></div></div>
      <div class="flex justify-center gap-6 mt-6 text-sm text-slate-600"><span>10 preguntas</span><span>·</span><span>Dificultad intermedia</span><span>·</span><span>4 alternativas</span></div>
      <p class="text-xs text-slate-400 mt-6">Esto toma menos de un minuto.</p></div></div>`, 'Mis evaluaciones');
  }, bind() { clearTimeout(S._t); if (S.animate) S._t = setTimeout(() => { if (cur().id === 'P-03') go('P-04'); }, 3400); } },

  { id: 'P-04', name: 'Preguntas generadas', hu: 'HU-1.2.1', hint: 'Diez preguntas con cuatro alternativas y la correcta marcada (CA-1.2-1). «Editar» lleva a P-05 y «Publicar» a P-06.', render() {
    return desktop('doc', 'Carla Rojas', `
      <div class="flex items-end justify-between mb-5"><div><div class="text-sm text-slate-500">Nueva evaluación › Revisión</div><h1 class="text-2xl font-bold text-navy">Razones · 6° básico</h1>
      <p class="text-slate-500 text-sm">10 preguntas generadas · dificultad intermedia · revisa antes de publicar</p></div>
      <div class="flex gap-2">${btn('Volver', P2, 'data-go="P-02"')}${btn('Publicar evaluación', P1, 'data-go="P-06"')}</div></div>
      <div class="grid grid-cols-2 gap-4">${S.qs.map((q, n) => `<div class="bg-white rounded-xl border border-slate-200 p-4">
        <div class="flex justify-between items-start gap-3"><div class="text-sm"><span class="font-bold text-navy">${n + 1}.</span> ${q.t}</div>
        <button data-edit="${n}" class="text-xs font-semibold text-navy border border-navy-100 rounded-md px-2 py-1 hover:bg-navy-50 shrink-0">Editar</button></div>
        <div class="grid grid-cols-2 gap-1.5 mt-3 text-xs">${q.a.map((a, j) => `<div class="px-2 py-1.5 rounded-md border ${j === q.c ? 'border-emerald-400 bg-emerald-50 text-emerald-900 font-semibold' : 'border-slate-200 text-slate-600'}">${L[j]}) ${a} ${j === q.c ? '✓' : ''}</div>`).join('')}</div>
        <div class="text-[11px] text-slate-400 mt-2">${IND[q.i].split(' · ')[0]} · ${IND[q.i].split(' · ')[1]}</div></div>`).join('')}</div>`, 'Mis evaluaciones');
  }, bind() { document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { S.editIdx = +b.dataset.edit; go('P-05'); }); } },

  { id: 'P-05', name: 'Editar pregunta', hu: 'HU-1.3', hint: 'Se edita el enunciado, las alternativas y la correcta (CA-1.3-1). «Reemplazar» aún no tiene interacción: quedó para el Sprint 2.', render() {
    const q = S.qs[S.editIdx];
    return desktop('doc', 'Carla Rojas', `
      <div class="text-sm text-slate-500 mb-1">Razones · 6° básico › Revisión › Pregunta ${S.editIdx + 1}</div>
      <h1 class="text-2xl font-bold text-navy mb-6">Editar pregunta ${S.editIdx + 1}</h1>
      <div class="bg-white rounded-xl border border-slate-200 p-6 max-w-3xl">
        <label class="text-sm font-medium text-slate-600">Enunciado</label>
        <textarea id="eT" rows="3" class="mt-1 w-full rounded-lg border border-slate-300 p-3">${q.t}</textarea>
        <div class="text-sm font-medium text-slate-600 mt-5 mb-2">Alternativas <span class="font-normal text-slate-400">(marca la correcta)</span></div>

// ===================== Navegación =====================
let idx = 0;
const cur = () => SCREENS[idx];
function go(id) { const i = SCREENS.findIndex(s => s.id === id); if (i >= 0) { idx = i; history.replaceState(null, '', '#' + id); draw(); } }
function draw() {
  const sc = cur();
  $('#stage').innerHTML = '<div class="w-max mx-auto">' + sc.render() + '</div>';
  $('#screenSel').value = sc.id;
  $('#hint').innerHTML = `<b class="text-gold">${sc.id} · ${sc.name}</b> · ${sc.hu} — ${sc.hint}`;
  $('#states').innerHTML = (sc.states || []).map((s, i) => `<button data-st="${i}" class="px-2 py-1 rounded text-xs bg-slate-700 hover:bg-slate-600">${s[0]}</button>`).join('');
  document.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { sc.states[+b.dataset.st][1](); draw(); });
  document.querySelectorAll('#stage [data-go]').forEach(e => e.addEventListener('click', () => go(e.dataset.go)));
  if (sc.bind) sc.bind();
}
$('#screenSel').innerHTML = SCREENS.map(s => `<option value="${s.id}">${s.id} · ${s.name} (${s.hu})</option>`).join('');
$('#screenSel').onchange = (e) => go(e.target.value);
$('#prev').onclick = () => { idx = (idx - 1 + SCREENS.length) % SCREENS.length; go(cur().id); };
$('#next').onclick = () => { idx = (idx + 1) % SCREENS.length; go(cur().id); };
function toggleBar() {
  const hidden = $('#toolbar').classList.toggle('hidden');
  $('#showBar').classList.toggle('hidden', !hidden);
  $('#stage').classList.toggle('pt-28', !hidden); $('#stage').classList.toggle('pt-10', hidden);
}
$('#hide').onclick = toggleBar; $('#showBar').onclick = toggleBar;
document.addEventListener('keydown', (e) => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
  if (e.key === 'h' || e.key === 'H') toggleBar();
  if (e.key === 'ArrowRight') $('#next').click();
  if (e.key === 'ArrowLeft') $('#prev').click();
});
$('#dl').onclick = async () => {
  const el = $('#capture'); const sc = cur();
  if (!window.html2canvas) { toast('No se pudo cargar la librería de captura. Usa la captura de pantalla del sistema.'); return; }
  toast('Generando imagen…');
  const extra = (sc.states || []).length && sc.id === 'P-11' ? (S.semaforo ? '_v2' : '_v1') : '';
  const canvas = await html2canvas(el, { scale: 2, backgroundColor: null, useCORS: true });
  const a = document.createElement('a');
  a.download = `${sc.id}_${sc.name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_')}${extra}.png`;
  a.href = canvas.toDataURL('image/png'); a.click();
};
go((location.hash || '#P-01').slice(1));
</script>
</body>
</html>
